name: Disparar mobile v4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-mobile-v4.yml']
permissions:
  actions: write
jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar workflow principal no commit atual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/publicar-mobile-v4.yml/dispatches \
            -d '{"ref":"main"}'
