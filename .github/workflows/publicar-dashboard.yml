name: Publicar Dashboard Eleitoral

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Importar HTML original para o repositório
        if: ${{ hashFiles('index.html') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output index.html 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c98c-820e-9c81-464780dc3ba3/raw?se=2026-11-01T14%3A46%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=ae00a9cb-cfee-585f-a84c-07bb0eb9ac25&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T13%3A00%3A26Z&ske=2026-11-02T13%3A00%3A26Z&sks=b&skv=2026-02-06&sig=ft4XIpr8nHiUJc5LEvRFTTYWbkA7HGIMPF8JQe%2B928o%3D'
          test $(wc -c < index.html) -gt 10000000
          grep -qi '<!doctype html' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Adicionar dashboard eleitoral 2026'
          git push origin HEAD:main

      - name: Preparar site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        if: ${{ steps.pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar no GitHub Pages
        if: ${{ steps.pages.outcome == 'success' }}
        id: deployment
        uses: actions/deploy-pages@v4
