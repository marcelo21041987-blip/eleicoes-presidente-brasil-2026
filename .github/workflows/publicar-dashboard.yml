name: Publicar Dashboard Eleitoral

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Validar dashboard público
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f data.bin
          grep -qi '<!doctype html' index.html
          grep -q 'raw.githubusercontent.com/marcelo21041987-blip/eleicoes-presidente-brasil-2026/main/data.bin' index.html
          grep -q 'Análise transversal — cruzar variáveis' index.html
          test $(wc -c < index.html) -gt 40000
          test $(wc -c < data.bin) -gt 12000000

      - name: Preparar site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html data.bin _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        if: ${{ steps.pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar no GitHub Pages
        if: ${{ steps.pages.outcome == 'success' }}
        id: deployment
        uses: actions/deploy-pages@v4
