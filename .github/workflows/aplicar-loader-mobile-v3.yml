name: Aplicar loader mobile por UF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-loader-mobile-v3.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Substituir carregador por versão fragmentada
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          novo = r'''async function load(){
            $('lt').textContent='Preparando base…';
            $('ls').textContent='Carregamento leve por UF • sem descompressão no celular';
            $('lb').style.width='5%';
            await new Promise(r=>requestAnimationFrame(r));

            const localBase=new URL('data/',location.href).href;
            const rawBase='https://raw.githubusercontent.com/marcelo21041987-blip/eleicoes-presidente-brasil-2026/main/data/';
            async function getJSON(file){
              let last=null;
              for(const base of [localBase,rawBase]){
                const ctl=new AbortController();
                const tm=setTimeout(()=>ctl.abort(),60000);
                try{
                  const r=await fetch(base+file,{cache:'no-store',signal:ctl.signal});
                  clearTimeout(tm);
                  if(!r.ok){last=Error('HTTP '+r.status+' em '+file);continue}
                  return await r.json();
                }catch(e){
                  clearTimeout(tm);
                  last=e;
                }
              }
              throw Error('Falha ao carregar '+file+': '+(last?last.message:'erro de rede'));
            }

            const [m,manifest]=await Promise.all([getJSON('meta.json'),getJSON('manifest.json')]);
            meta=m;
            rows=[];
            const files=manifest.files||[];
            for(let i=0;i<files.length;i++){
              const f=files[i];
              $('lt').textContent='Carregando '+(i+1)+'/'+files.length+' • '+f.uf;
              $('ls').textContent=fmt(rows.length)+' seções já carregadas';
              $('lb').style.width=(8+Math.round((i/files.length)*82))+'%';
              await new Promise(r=>requestAnimationFrame(r));
              let part=await getJSON(f.file);
              if(!Array.isArray(part))throw Error('Formato inválido em '+f.file);
              for(let j=0;j<part.length;j++)rows.push(part[j]);
              part=null;
              await new Promise(r=>setTimeout(r,0));
            }
            if(manifest.totalRows&&rows.length!==manifest.totalRows)throw Error('Base incompleta: '+rows.length+' de '+manifest.totalRows+' seções');
            $('lt').textContent='Montando índices…';
            $('ls').textContent=fmt(rows.length)+' seções recebidas';
            $('lb').style.width='94%';
            await new Promise(r=>requestAnimationFrame(r));
            index();
            $('lb').style.width='100%';
            $('lt').textContent='Base carregada';
            $('ls').textContent=fmt(rows.length)+' seções • carregamento por UF concluído';
            init();
          }'''

          pat = r"async function load\(\)\{.*?\}\nfunction index\(\)\{"
          repl = novo + "\nfunction index(){"
          s2, n = re.subn(pat, repl, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Falha: loader atual não localizado ({n})')

          s2 = s2.replace('Base publicada no GitHub • carregamento móvel otimizado.', 'Base por UF • carregamento móvel compatível.')
          p.write_text(s2, encoding='utf-8')
          print('Loader substituído com sucesso')
          PY

      - name: Validar ausência de DecompressionStream no loader
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "Carregamento leve por UF" in s
          assert "manifest.json" in s
          assert "async function load()" in s
          print('Validação OK')
          PY

      - name: Publicar novo index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrigir carregamento mobile com base por UF"
          git push
