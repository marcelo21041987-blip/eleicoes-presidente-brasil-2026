abel for=\"transX\">Variável X</label><select id=\"transX\"></select></div>\n    <div><label for=\"transY\">Variável Y</label><select id=\"transY\"></select></div>\n    <div><label for=\"transMin\">Comparecimento mínimo / turno</label><input id=\"transMin\" type=\"number\" min=\"0\" step=\"10\" value=\"100\"></div>\n    <div><button id=\"transRun\" type=\"button\">Atualizar</button></div>\n  </div>\n  <div class=\"facts trans-stats\">\n    <div class=\"fact\"><small>Observações</small><strong id=\"transN\">—</strong></div>\n    <div class=\"fact\"><small>Correlação de Pearson (r)</small><strong id=\"transR\">—</strong></div>\n    <div class=\"fact\"><small>R² linear</small><strong id=\"transR2\">—</strong></div>\n    <div class=\"fact\"><small>Média X</small><strong id=\"transMeanX\">—</strong></div>\n    <div class=\"fact\"><small>Média Y</small><strong id=\"transMeanY\">—</strong></div>\n    <div class=\"fact\"><small>Escopo</small><strong id=\"transScope\">—</strong></div>\n  </div>\n  <div class=\"trans-chart\" id=\"transChart\"><div class=\"audit-empty\">Abra o painel para calcular.</div></div>\n  <div class=\"note\" id=\"transInterpret\">A correlação descreve associação linear entre variáveis agregadas por seção; não demonstra causalidade nem comportamento individual.</div>\n  <h2 style=\"margin-top:14px\">Extremos combinados do par selecionado</h2>\n  <div class=\"tablewrap\"><table class=\"audit-table trans-table\"><thead><tr><th>Local</th><th>Zona / seção</th><th id=\"transHX\">X</th><th id=\"transHY\">Y</th><th>z(X)</th><th>z(Y)</th><th>Distância padronizada</th></tr></thead><tbody id=\"transOutliers\"></tbody></table></div>\n  <div class=\"trans-actions\"><button id=\"matrixRun\" type=\"button\">Calcular matriz de correlações</button></div>\n  <div id=\"matrixWrap\" style=\"display:none;margin-top:9px\"><div class=\"tablewrap\"><table class=\"audit-table corr-matrix\"><thead id=\"matrixHead\"></thead><tbody id=\"matrixBody\"></tbody></table></div><div cla /1800)),seen=0,sample=[],top=[];for(let i=a;i<b;i++){let r=rows[i];if(!transEligible(r,min))continue;let x=transVal(r,xk),y=transVal(r,yk);if(x===null||y===null||!Number.isFinite(x)||!Number.isFinite(y))continue;if(seen%step===0&&sample.length<2200)sample.push([x,y]);seen++;let zx=sdx?(x-mx)/sdx:0,zy=sdy?(y-my)/sdy:0,score=Math.sqrt(zx*zx+zy*zy);let item={i,x,y,zx,zy,score};if(top.length<25){top.push(item);top.sort((p,q)=>q.score-p.score)}else if(score>top[top.length-1].score){top[top.length-1]=item;top.sort((p,q)=>q.score-p.score)}}drawTransScatter(sample,minx,maxx,miny,maxy,xk,yk);$('transOutliers').innerHTML=top.map(o=>{let r=rows[o.i];return'<tr data-row=\"'+o.i+'\"><td>'+escHtml(uf(r[F.U])+' · '+name(r[F.M]))+'</td><td>'+r[F.Z]+' / '+r[F.S]+'</td><td>'+tfmt(o.x,xk)+'</td><td>'+tfmt(o.y,yk)+'</td><td>'+o.zx.toFixed(2)+'</td><td>'+o.zy.toFixed(2)+'</td><td><strong>'+o.score.toFixed(2)+'</strong></td></tr>'}).join('');$('transOutliers').querySelectorAll('tr[data-row]').forEach(tr=>tr.onclick=()=>{let r=rows[+tr.dataset.row];cur={u:r[F.U],m:r[F.M],z:r[F.Z],s:r[F.S]};$('uf').value=cur.u;fillM();$('mun').value=cur.m;fillZ();$('z').value=cur.z;fillS();$('s').value=cur.s;render();window.scrollTo({top:0,behavior:'smooth'})})}\nfunction drawTransScatter(sample,minx,maxx,miny,maxy,xk,yk){let W=900,H=380,L=76,R=22,T=20,BT=58,dx=maxx-minx||1,dy=maxy-miny||1,sx=x=>L+(x-minx)/dx*(W-L-R),sy=y=>H-BT-(y-miny)/dy*(H-T-BT),pts=sample.map(p=>'<circle class=\"trans-point\" cx=\"'+sx(p[0]).toFixed(1)+'\" cy=\"'+sy(p[1]).toFixed(1)+'\" r=\"2\"/>').join('');let gx='',gy='';for(let j=0;j<=4;j++){let px=L+j*(W-L-R)/4,py=T+j*(H-T-BT)/4;gx+='<line class=\"trans-gridline\" x1=\"'+px+'\" y1=\"'+T+'\" x2=\"'+px+'\" y2=\"'+(H-BT)+'\"/>';gy+='<line class=\"trans-gridline\" x1=\"'+L+'\" y1=\"'+py+'\" x2=\"'+(W-R)+'\" y2=\"'+py+'\"/>'}let svg='<svg viewBox=\"0 0 '+W+' '+H+'\" role=\"img\" aria-label=\"Gráfico de dispersão\"><g>'+gx+gy+pts+'</g><text class=\"trans-axis\" x=\"'+L+'\" y=\"'+(H-34)+'
